name: CI/CD Pipeline - Misión 1

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pruebas-y-seguridad:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install flask pytest bandit
          pip install pytest bandit

      - name: Pruebas Unitarias (Pytest)
        run: |
          pytest

      - name: Análisis Estático de Seguridad Python (Bandit)
        run: |
          bandit -r . -x ./test_app.py,./.venv -s B104

      - name: Construir Imagen Docker para Análisis
        run: |
          docker build --no-cache -t app-flask:test .

      - name: Instalar Trivy CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Análisis de Vulnerabilidades en Contenedores (Trivy)
        run: |
          trivy image --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH app-flask:test

  despliegue:
    needs: pruebas-y-seguridad
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v3

      - name: Desplegar por SSH a EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/despliegue_automatizado
            git pull origin main
            docker compose up -d --build
            